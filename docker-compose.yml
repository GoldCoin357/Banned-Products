version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banned-products-app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # SQLite database persistence
      - ./.env:/app/.env:ro       # environment config
    environment:
      - DATABASE_URL=sqlite:///./data/banned_products.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
